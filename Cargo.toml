[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rscraft-world = { path = "crates/world" }
rscraft-assets = { path = "crates/assets" }

wgpu = "30.0.1"
winit = "0.30.13"
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
log = "0.4.34"
env_logger = "0.11.11"
fastnoise-lite = "1.1.1"
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
anyhow = "1.0.104"
dirs = "7.0.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
ureq = "3.4.2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# World generation and meshing are far too slow without optimizations.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
